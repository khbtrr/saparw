server {
    listen 80;
    server_name saparw05.karangraharja.desa.id;

    # Ukuran maksimal unggahan foto aduan (3 foto x 2 MB + buffer)
    client_max_body_size 10M;

    # 1. Root diarahkan ke hasil build statis React (frontend/dist)
    root /var/www/saparw/frontend/dist;
    index index.html;

    # 2. Teruskan request /api dan /up ke backend Laravel (public/index.php)
    location ~ ^/(api|up) {
        root /var/www/saparw/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/saparw/backend/public/index.php;
            include fastcgi_params;
        }
    }

    # 3. Layani file lampiran foto dari symlink storage Laravel (/storage/aduan/*)
    location ^~ /storage/ {
        alias /var/www/saparw/backend/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 4. Jangan layani mockServiceWorker.js di produksi
    location = /mockServiceWorker.js {
        return 404;
    }

    # 5. Fallback SPA React Router (semua route seperti /masuk, /warga/aduan, /admin/aduan)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 6. Cache aset statis Vite (JS/CSS/Images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

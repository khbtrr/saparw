server {
    listen 80;
    server_name saparw05.karangraharja.desa.id;

    # Allow up to 3 complaint photos (2 MB each) plus multipart overhead.
    client_max_body_size 10M;

    root /var/www/saparw/frontend/dist;
    index index.html;

    location ~ ^/(api|up) {
        root /var/www/saparw/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/saparw/backend/public/index.php;
            include fastcgi_params;
        }
    }

    location ^~ /storage/ {
        alias /var/www/saparw/backend/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Block MSW script in production builds.
    location = /mockServiceWorker.js {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

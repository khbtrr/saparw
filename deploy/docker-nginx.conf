server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/saparw/frontend/dist;
    index index.html;

    location ~ ^/(api|up) {
        root /var/www/saparw/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/saparw/backend/public/index.php;
            include fastcgi_params;
        }
    }

    location ^~ /storage/ {
        alias /var/www/saparw/backend/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;

        location ~* \.(php|phtml|phar)$ {
            deny all;
        }
    }

    location = /mockServiceWorker.js {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
